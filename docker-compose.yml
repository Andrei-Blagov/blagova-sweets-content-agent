services:
  api:
    build: .
    container_name: blagova-sweets-content-agent
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8090}:${APP_PORT:-8090}"
    env_file:
      - .env
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "${APP_PORT:-8090}"
      DB_PATH: "/app/data/history.db"
    volumes:
      - blagova_sweets_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${APP_PORT:-8090}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  telegram-bot:
    build: .
    container_name: blagova-sweets-telegram-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PATH: "/app/data/history.db"
    volumes:
      - blagova_sweets_data:/app/data
    command: ["python", "-m", "app.telegram.bot"]
    profiles:
      - bot
    depends_on:
      api:
        condition: service_healthy

volumes:
  blagova_sweets_data:
